<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlockVerse 3D Parkour</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="hud"><div class="brand">BLOCKVERSE <small>3D PARKOUR</small></div><div>🪙 <span id="coins">0</span></div><div>🏆 <span id="level">1</span></div><div>⚡ <span id="speed">0</span></div></div>
<div id="crosshair">+</div><div id="message"></div>
<div id="mouseHint">🖱️ Clique e arraste para olhar</div>
<div id="menu" class="hidden" aria-hidden="true"><div class="panel"><h1>PAUSADO</h1><button id="resume">Continuar</button><button id="settingsBtn">⚙️ Configurações</button><button id="manualBtn">📖 Manual</button><button id="restartBtn">🔄 Reiniciar</button><div id="settings" class="sub hidden"><h2>Configurações</h2><label>Qualidade <select id="quality"><option value="1">Alta</option><option value=".75">Média</option><option value=".5">Baixa</option></select></label></div><div id="manual" class="sub hidden"><h2>Manual</h2><p><b>WASD / Setas</b> — movimentar<br><b>Espaço</b> — pular<br><b>Shift</b> — correr<br><b>Mouse</b> — clicar e arrastar para olhar<br><b>R</b> — reiniciar<br><b>Esc</b> — abrir/fechar menu</p></div></div></div>
<canvas id="game"></canvas><script src="game.js"></script></body></html>
